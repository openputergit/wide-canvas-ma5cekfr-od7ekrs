<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenwriting Editor</title>
    <script src="https://unpkg.com/fountain-js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neo-morphism {
            border-radius: 20px;
            background: #e0e5ec;
            box-shadow: 20px 20px 60px #bec3c9,
                       -20px -20px 60px #ffffff;
        }
        .neo-button {
            border-radius: 10px;
            background: #e0e5ec;
            box-shadow: 5px 5px 15px #bec3c9,
                       -5px -5px 15px #ffffff;
            transition: all 0.3s ease;
        }
        .neo-button:active {
            box-shadow: inset 5px 5px 10px #bec3c9,
                       inset -5px -5px 10px #ffffff;
        }
        #editor {
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.6;
            tab-size: 4;
        }
    </style>
</head>
<body class="bg-[#e0e5ec] min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <div class="neo-morphism p-6 mb-6">
            <h1 class="text-2xl font-bold text-gray-700 mb-4">Fountain Screenwriting Editor</h1>
            <div class="flex gap-4 mb-4">
                <button onclick="saveScript()" class="neo-button px-4 py-2 text-gray-700">
                    <i class="bi bi-save"></i> Save
                </button>
                <button onclick="loadScript()" class="neo-button px-4 py-2 text-gray-700">
                    <i class="bi bi-folder2-open"></i> Load
                </button>
                <button onclick="exportPDF()" class="neo-button px-4 py-2 text-gray-700">
                    <i class="bi bi-file-pdf"></i> Export PDF
                </button>
            </div>
            <textarea id="editor" class="neo-morphism w-full h-[70vh] p-4 text-gray-700 focus:outline-none" spellcheck="true"></textarea>
        </div>
        <div id="preview" class="neo-morphism p-6">
            <h2 class="text-xl font-bold text-gray-700 mb-4">Preview</h2>
            <div id="formatted-output" class="text-gray-700"></div>
        </div>
    </div>

    <script>
        // Initialize editor with sample script
        const sampleScript = `EXT. CANYON - DAY

The sun blazes overhead, sharp shadows slicing across the
jagged rocks. Tension thickens as the team navigates the
narrow path, footsteps echoing against the canyon walls.
Test test test.

test test test

JACK strides ahead, determination etched on his face. He
glances back, eyes fierce.

JACK
We have to keep moving!

RACHEL, a few steps behind, scans the surroundings, brow
furrowed.

RACHEL
Something feels off. i'm
writingfadsf adf asdf das fas df`;

        const editor = document.getElementById('editor');
        editor.value = sampleScript;

        // Auto-update preview
        editor.addEventListener('input', updatePreview);

        function updatePreview() {
            const fountain = new Fountain(editor.value);
            const formatted = fountain.html.script;
            document.getElementById('formatted-output').innerHTML = formatted;
        }

        function saveScript() {
            const content = editor.value;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'screenplay.fountain';
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function loadScript() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.fountain,.txt';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    editor.value = event.target.result;
                    updatePreview();
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function exportPDF() {
            alert('PDF export functionality would be implemented here');
            // Would typically use a library like jsPDF to generate PDF
        }

        // Initial preview
        updatePreview();
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
